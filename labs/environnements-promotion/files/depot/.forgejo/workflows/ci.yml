name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  integrer:
    runs-on: debian
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint
      - run: make test
      - run: make build
      # Publier ce qui vient d'être construit et testé, seulement pour une
      # étiquette de version : jamais de seconde construction.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: make publish
        env:
          REGISTRE_JETON: ${{ secrets.REGISTRE_JETON }}
