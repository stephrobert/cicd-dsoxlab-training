---
# État de départ : la pipeline du lab précédent (lint, test, build sur main
# et sur demande de fusion), un registre vide, et le secret REGISTRE_JETON.
# L'apprenant ajoute la cible make publish et la publication sur étiquette.
- name: Socle commun
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Dépôt avec sa pipeline d'intégration
  ansible.builtin.import_playbook: ../_commun/depot.yaml
  vars:
    depot_message: "inventaire 1.0.0 : service, tests, Makefile et pipeline d'intégration"
    depot_overlay: artefacts

- name: Secret de publication
  ansible.builtin.import_playbook: ../_commun/secret-registre.yaml

- name: Préparer le lab artefacts
  hosts: lab_target
  become: true
  gather_facts: false
  tasks:
    - name: Aucun artefact téléchargé d'un passage précédent
      ansible.builtin.file:
        path: /home/ansible/inventaire-1.0.0.pyz
        state: absent
