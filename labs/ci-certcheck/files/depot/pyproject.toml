[project]
name = "certcheck"
version = "0.5.0"
description = "Signale les certificats TLS d'un parc qui arrivent à expiration."
requires-python = ">=3.12"
# Bibliothèque standard seule, plus le programme openssl du système.
dependencies = []

# La commande `certcheck` : la fonction main du module certcheck.cli.
[project.scripts]
certcheck = "certcheck.cli:main"

# Les outils du développeur, épinglés et verrouillés dans uv.lock.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
