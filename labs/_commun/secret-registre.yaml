---
# Le secret de dépôt REGISTRE_JETON : un jeton DÉDIÉ à la publication, limité
# à la portée write:package. Recréé à chaque setup (le dépôt l'est aussi).
- name: Secret de publication REGISTRE_JETON
  hosts: lab_target
  become: true
  gather_facts: false
  tasks:
    - name: Jeton write:package et secret de dépôt
      ansible.builtin.shell:
        cmd: |
          set -eu
          F="/usr/local/bin/forgejo --config /etc/forgejo/app.ini --work-path /var/lib/forgejo"
          # Un seul jeton de publication à la fois : les précédents sont révoqués.
          U=http://localhost:3000/api/v1/users/apprenant/tokens
          for ancien in $(curl -fsS -u apprenant:apprenant-lab "$U" | jq -r '.[] | select(.name | startswith("publication-")) | .name'); do
            curl -fsS -o /dev/null -X DELETE -u apprenant:apprenant-lab "$U/$ancien"
          done
          NOM="publication-$(date +%s%N)"
          T=$(sudo -u git $F admin user generate-access-token --username apprenant \
                --token-name "$NOM" --scopes write:package --raw)
          # Le NOM du jeton (jamais sa valeur) est gardé, pour vérifier une révocation.
          printf '%s\n' "$NOM" > /etc/forgejo/jeton-publication-nom
          J=$(cat /etc/forgejo/jeton-apprenant)
          printf '{"data":"%s"}' "$T" | curl -fsS -o /dev/null -X PUT -H "Authorization: token $J" \
            -H 'Content-Type: application/json' --data-binary @- \
            http://localhost:3000/api/v1/repos/apprenant/inventaire/actions/secrets/REGISTRE_JETON
        executable: /bin/bash
      no_log: true
      changed_when: true
