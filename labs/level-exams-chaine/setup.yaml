---
# État de départ de l'épreuve : une chaîne qui « marche » en apparence. Le
# premier push a déjà publié inventaire 1.0.0, construit sur un code faux dont
# le test en échec est ignoré. Défauts semés (liste fermée, notée par les
# tests) : test ignoré (|| true), étape hors make, action épinglée par tag,
# secret affiché dans le journal, publication depuis toute branche, déploiement
# qui reconstruit l'artefact et interpole les entrées dans run:.
- name: Socle commun
  ansible.builtin.import_playbook: ../_commun/socle.yaml

- name: Dépôt à la chaîne cassée
  ansible.builtin.import_playbook: ../_commun/depot.yaml
  vars:
    depot_message: "inventaire 1.0.0 : la chaîne livre, en apparence"
    depot_overlay: level-exams-chaine

- name: Secret de publication
  ansible.builtin.import_playbook: ../_commun/secret-registre.yaml

- name: Environnements
  ansible.builtin.import_playbook: ../_commun/environnements.yaml

- name: Ajouter la chaîne cassée, une fois le secret en place
  hosts: lab_target
  become: true
  gather_facts: false
  tasks:
    # Les workflows arrivent par un second commit : poussés avec le dépôt, ils
    # tourneraient avant la création du secret REGISTRE_JETON.
    - name: Répertoire des workflows
      ansible.builtin.file:
        path: /home/ansible/inventaire/.forgejo/workflows
        state: directory
        owner: ansible
        group: ansible
        mode: "0755"

    - name: Workflows de l'équipe
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/workflows/"
        dest: /home/ansible/inventaire/.forgejo/workflows/
        owner: ansible
        group: ansible
        mode: "0644"

    - name: Commiter et pousser la chaîne
      ansible.builtin.shell:
        cmd: |
          set -eu
          git add .forgejo
          git commit -qm "ci : intégration, publication et déploiement automatiques"
          git push -q origin main
        chdir: /home/ansible/inventaire
        executable: /bin/bash
      become_user: ansible
      changed_when: true

    - name: Le paquet 1.0.0 existe
      ansible.builtin.uri:
        url: "http://localhost:3000/api/packages/apprenant/generic/inventaire/1.0.0/inventaire-1.0.0.pyz.sha256"
      register: p100
      until: p100.status == 200
      retries: 60
      delay: 3
