name: deployer

on:
  workflow_dispatch:
    inputs:
      environnement:
        type: choice
        options: [recette, production]
        required: true

jobs:
  deployer:
    runs-on: debian
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - run: make build
      - run: install -m 0644 dist/inventaire-*.pyz /opt/inventaire/${{ inputs.environnement }}/inventaire.pyz
      - run: sudo /usr/bin/systemctl restart inventaire@${{ inputs.environnement }}.service
